version: '3.8'

services:
  kiai-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kiai-assistant
    ports:
      - "${PORT:-5050}:5050"
    env_file:
      - .env
    environment:
      - PORT=5050
      - PYTHONUNBUFFERED=1
    volumes:
      - ./sessions:/app/sessions
    restart: unless-stopped
    networks:
      - kiai-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5050/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  kiai-network:
    driver: bridge

volumes:
  sessions-data:
